name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate-shaders:
    name: Validate GLSL 4.60 Shaders (GLSL & SPIR-V)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Khronos glslang-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools
          glslangValidator --version

      - name: Validate compute and graphics shaders
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p /tmp/spirv_out

          shaders=(
            shaders/compute/*.comp
            shaders/graphics/*.vert
            shaders/graphics/*.frag
          )

          if [ "${#shaders[@]}" -eq 0 ]; then
            echo "No shaders found to validate!"
            exit 1
          fi

          for shader in "${shaders[@]}"; do
            echo "=== Validating (OpenGL GLSL): $shader ==="
            glslangValidator "$shader"
            echo "=== Validating (OpenGL 4.60 SPIR-V -G): $shader ==="
            glslangValidator -G "$shader" -o "/tmp/spirv_out/$(basename "$shader").spv"
          done

          echo "All ${#shaders[@]} shaders passed OpenGL GLSL and SPIR-V (-G) validation."

  build-and-test:
    name: Build & Test C++20 (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libgl1-mesa-dev glslang-tools

      - name: Configure headless core & unit tests (ENABLE_OPENGL_RUNTIME=OFF)
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          cmake -S . -B build-headless -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror" \
            -DENABLE_OPENGL_RUNTIME=OFF \
            -DENABLE_TESTS=ON

      - name: Build headless core & tests
        run: cmake --build build-headless --parallel

      - name: Run CTest unit test suite
        run: ctest --test-dir build-headless --output-on-failure

      - name: Run CMake validate_shaders target
        run: cmake --build build-headless --target validate_shaders

      - name: Configure & build OpenGL 4.6 DSA runtime (ENABLE_OPENGL_RUNTIME=ON)
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          cmake -S . -B build-gl -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror" \
            -DENABLE_OPENGL_RUNTIME=ON \
            -DENABLE_TESTS=ON
          cmake --build build-gl --parallel
          ctest --test-dir build-gl --output-on-failure
